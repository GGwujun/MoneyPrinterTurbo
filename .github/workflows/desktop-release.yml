name: Desktop Release

# Builds the Electron desktop app and publishes a GitHub Release.
# - Push a version tag (v1.3.4) → build + create GitHub Release
# - Manual dispatch → build only (artifacts available for download)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  # Suppress Node 20 deprecation warnings from older action versions
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
            artifact-name: MoneyPrinterTurbo-Setup.exe
            artifact-pattern: desktop/dist/*
          - os: macos-latest
            build-script: build:mac
            artifact-name: MoneyPrinterTurbo.dmg
            artifact-pattern: desktop/dist/*
          - os: ubuntu-latest
            build-script: build:linux
            artifact-name: MoneyPrinterTurbo.AppImage
            artifact-pattern: desktop/dist/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('uv.lock') }}

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install npm dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron app
        working-directory: desktop
        run: npm run ${{ matrix.build-script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only create a release on tag push — not on workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          cd artifacts
          echo "=== Release artifacts ==="
          for f in *; do
            echo "  $f ($(du -h "$f" | cut -f1))"
          done

      - name: Generate update metadata (latest.yml)
        shell: bash
        run: |
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cd artifacts

          # ── Windows NSIS: latest.yml ──
          WIN_EXE=$(ls *.exe 2>/dev/null | head -1)
          if [ -n "$WIN_EXE" ]; then
            WIN_SHA=$(openssl dgst -sha512 -binary "$WIN_EXE" | base64 -w0)
            WIN_SIZE=$(stat -c%s "$WIN_EXE")
            cat > latest.yml << YEOF
          version: ${VERSION_NUM}
          files:
            - url: ${WIN_EXE}
              sha512: ${WIN_SHA}
              size: ${WIN_SIZE}
          path: ${WIN_EXE}
          sha512: ${WIN_SHA}
          releaseDate: '${RELEASE_DATE}'
          YEOF
            echo "✓ latest.yml  (${WIN_EXE})"
          else
            echo "⚠ No .exe found, skipping latest.yml"
          fi

          # ── macOS DMG: latest-mac.yml ──
          DMG_FILES=$(ls *.dmg 2>/dev/null)
          if [ -n "$DMG_FILES" ]; then
            FIRST_DMG=""
            FIRST_SHA=""
            {
              echo "version: ${VERSION_NUM}"
              echo "files:"
              for f in $DMG_FILES; do
                S=$(openssl dgst -sha512 -binary "$f" | base64 -w0)
                Z=$(stat -c%s "$f")
                echo "  - url: ${f}"
                echo "    sha512: ${S}"
                echo "    size: ${Z}"
                if [ -z "$FIRST_SHA" ]; then
                  FIRST_DMG="$f"
                  FIRST_SHA="$S"
                fi
              done
              echo "path: ${FIRST_DMG}"
              echo "sha512: ${FIRST_SHA}"
              echo "releaseDate: '${RELEASE_DATE}'"
            } > latest-mac.yml
            echo "✓ latest-mac.yml  (${DMG_FILES})"
          else
            echo "⚠ No .dmg found, skipping latest-mac.yml"
          fi

          # ── Linux AppImage: latest-linux.yml ──
          APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            APPSHA=$(openssl dgst -sha512 -binary "$APPIMAGE" | base64 -w0)
            APPSIZE=$(stat -c%s "$APPIMAGE")
            cat > latest-linux.yml << YEOF
          version: ${VERSION_NUM}
          files:
            - url: ${APPIMAGE}
              sha512: ${APPSHA}
              size: ${APPSIZE}
          path: ${APPIMAGE}
          sha512: ${APPSHA}
          releaseDate: '${RELEASE_DATE}'
          YEOF
            echo "✓ latest-linux.yml  (${APPIMAGE})"
          else
            echo "⚠ No .AppImage found, skipping latest-linux.yml"
          fi

          echo ""
          echo "=== Final artifacts ==="
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## MoneyPrinterTurbo Desktop ${{ github.ref_name }}

            ### 🖥️ Desktop App Downloads

            | Platform | Download |
            |---|---|
            | 🪟 Windows | `MoneyPrinterTurbo-Setup.exe` |
            | 🍎 macOS | `MoneyPrinterTurbo.dmg` |
            | 🐧 Linux | `MoneyPrinterTurbo.AppImage` |

            ### 📦 Requirements
            - **Python 3.11+** and **FFmpeg** required on first launch
            - Or install **uv** for automatic dependency management

            ### 🔄 Auto-Update
            The desktop app automatically detects and offers to install this update.

            See [full changelog](https://github.com/harry0703/MoneyPrinterTurbo/commits/main).
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
